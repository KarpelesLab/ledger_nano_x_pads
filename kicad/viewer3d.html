<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nano X board 3D</title>
<style>
  :root { --panel: rgba(18, 20, 24, .86); --text: #e8e8e8; --muted: #a0a4ab; --accent: #ffd43b; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171b; color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; touch-action: none; }
  #panel { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); padding: 8px 10px;
           background: var(--panel); border-radius: 6px; max-width: min(320px, calc(100vw - 16px));
           max-height: calc(100dvh - 16px); overflow-y: auto; box-sizing: border-box; touch-action: manipulation; }
  #panel summary { cursor: pointer; font-weight: bold; font-size: 14px; }
  #panel[open] summary { margin-bottom: 4px; }
  #panel label { display: flex; gap: 6px; align-items: center; padding: 2px 0; cursor: pointer; }
  #panel .buttons { display: flex; gap: 6px; margin: 6px 0 2px; flex-wrap: wrap; }
  #panel button { font: inherit; cursor: pointer; }
  #panel .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  #tip { position: fixed; pointer-events: none; max-width: 360px; padding: 6px 10px; background: var(--panel);
         border: 1px solid #444; border-radius: 6px; font-size: 12px; }
  #tip b { font-size: 13px; color: var(--accent); }
  #tip .meta { color: var(--muted); }
  #tip p { margin: 3px 0 0; }
  #tip ul { margin: 3px 0 0; padding-left: 16px; }
  /* touch screens: bigger controls, and details in a sheet along the bottom instead of next to the finger */
  @media (pointer: coarse) {
    #panel { font-size: 15px; }
    #panel label { padding: 5px 0; }
    #panel input[type=checkbox] { width: 20px; height: 20px; }
    #panel select, #panel button { font-size: 16px; padding: 6px 12px; }
    #tip { left: max(8px, env(safe-area-inset-left)) !important; right: max(8px, env(safe-area-inset-right));
           top: auto !important; bottom: max(8px, env(safe-area-inset-bottom)); max-width: none;
           max-height: 40dvh; overflow-y: auto; pointer-events: auto; font-size: 14px; }
    #tip b { font-size: 15px; }
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }
</style>
</head>
<body>
<div id="view"></div>
<div id="loading">Loading…</div>
<details id="panel" open>
  <summary>Nano X main board, reconstructed</summary>
  <label><input type="checkbox" id="opt-parts" checked> Components</label>
  <label><input type="checkbox" id="opt-pours" checked> Ground pours</label>
  <label><input type="checkbox" id="opt-tracks" checked> Tracks and vias</label>
  <label>Implant overlay
    <select id="implant">
      <option value="">none</option>
      <option value="C">Specimen C (generation 1)</option>
      <option value="A">Specimen A (generation 2)</option>
      <option value="B">Specimen B (generation 3)</option>
    </select>
  </label>
  <div class="hint" id="implant-note" hidden></div>
  <div class="buttons">
    <button id="top">Top</button><button id="bottom">Bottom</button><button id="angle">Angle</button>
  </div>
  <div class="hint" id="help">Drag to rotate, right-drag to pan, scroll to zoom. Hover a track, via, pad or part for details;
    nets light up on both sides. Zoom in on the secure element (SE1) to see inside it.</div>
</details>
<div id="tip" hidden></div>
<script src="scene.js"></script>
<script src="implants.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const S = window.SCENE;
const T = S.thickness, top = T / 2;
const $ = id => document.getElementById(id);

// ---- renderer, camera, lights ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
$('view').append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#15171b');
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, .1, 1000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight('#ffffff', '#444444', 1.2));
const sun = new THREE.DirectionalLight('#ffffff', 1.6);
sun.position.set(-30, -40, 80);
scene.add(sun);
const under = new THREE.DirectionalLight('#ffffff', .9);
under.position.set(30, 40, -80);
scene.add(under);

const xs = S.outline.map(p => p[0]), ys = S.outline.map(p => p[1]);
const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
const root = new THREE.Group();
root.position.set(-cx, -cy, 0);
scene.add(root);

// ---- materials ----
const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .55, metalness: .1, side: THREE.DoubleSide });
const M = {
  board: new THREE.MeshStandardMaterial({ color: '#174a2a', roughness: .7 }),
  pour: mat('#2a6b3c'), track: mat('#3d8a4f'),
  pad: new THREE.MeshStandardMaterial({ color: '#d6b25e', roughness: .35, metalness: .7, side: THREE.DoubleSide }),
  via: new THREE.MeshStandardMaterial({ color: '#c9a24f', roughness: .4, metalness: .6 }),
  hi: new THREE.MeshStandardMaterial({ color: '#ffd43b', emissive: '#7a5a00', roughness: .4, side: THREE.DoubleSide }),
  cap: new THREE.MeshStandardMaterial({ color: '#cfcfcf', roughness: .3, metalness: .8 }),
};

// pickable meshes, and lookups to highlight a whole net or part
const pickable = [], byNet = new Map(), byRef = new Map();
function register(mesh, info) {
  mesh.userData = info;
  mesh.userData.base = mesh.material;
  pickable.push(mesh);
  if (info.net) (byNet.get(info.net) || byNet.set(info.net, []).get(info.net)).push(mesh);
  if (info.ref) (byRef.get(info.ref) || byRef.set(info.ref, []).get(info.ref)).push(mesh);
}
const groups = { pours: new THREE.Group(), tracks: new THREE.Group(), parts: new THREE.Group() };
Object.values(groups).forEach(g => root.add(g));
const zOf = (side, lift) => side === 'front' ? top + lift : -top - lift;

// ---- board ----
const shapeOf = pts => new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
{
  const g = new THREE.ExtrudeGeometry(shapeOf(S.outline), { depth: T, bevelEnabled: false });
  const m = new THREE.Mesh(g, M.board);
  m.position.z = -top;
  root.add(m);
}

// ---- copper ----
for (const f of S.fills) {
  const sh = shapeOf(f.rings[0]);
  for (const h of f.rings.slice(1)) sh.holes.push(new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x, y))));
  const m = new THREE.Mesh(new THREE.ShapeGeometry(sh), M.pour);
  m.position.z = zOf(f.side, .004);
  groups.pours.add(m);
  register(m, { kind: 'pour', net: f.net, side: f.side });
}
// a track segment with round ends, as KiCad draws it, so segments meet cleanly at each bend
function stadium(len, w) {
  const r = w / 2, h = len / 2, sh = new THREE.Shape();
  sh.moveTo(-h, -r);
  sh.lineTo(h, -r);
  sh.absarc(h, 0, r, -Math.PI / 2, Math.PI / 2, false);
  sh.lineTo(-h, r);
  sh.absarc(-h, 0, r, Math.PI / 2, Math.PI * 3 / 2, false);
  return new THREE.ShapeGeometry(sh, 6);
}
for (const t of S.tracks) {
  const [ax, ay] = t.a, [bx, by] = t.b, len = Math.hypot(bx - ax, by - ay);
  const m = new THREE.Mesh(stadium(len, t.w), M.track);
  m.position.set((ax + bx) / 2, (ay + by) / 2, zOf(t.side, .008));
  m.rotation.z = Math.atan2(by - ay, bx - ax);
  groups.tracks.add(m);
  register(m, { kind: 'track', net: t.net, side: t.side });
}
for (const v of S.vias) {
  const g = new THREE.CylinderGeometry(v.d / 2, v.d / 2, T + .03, 16);
  g.rotateX(Math.PI / 2);
  const m = new THREE.Mesh(g, M.via);
  m.position.set(v.at[0], v.at[1], 0);
  groups.tracks.add(m);
  register(m, { kind: 'via', net: v.net });
}
for (const p of S.pads) {
  const g = p.circle ? new THREE.CircleGeometry(p.w / 2, 24) : new THREE.PlaneGeometry(p.w, p.h);
  const m = new THREE.Mesh(g, M.pad);
  m.position.set(p.at[0], p.at[1], zOf(p.side, .012));
  // KiCad pad angles turn counter-clockwise in its y-down view, so the same way here with y up
  m.rotation.z = p.rot * Math.PI / 180;
  root.add(m);
  register(m, { kind: 'pad', net: p.net, ref: p.ref, num: p.num, pin: p.pin, side: p.side });
}

// ---- parts ----
function markingTexture(text, wPx, hPx) {
  const c = document.createElement('canvas');
  c.width = wPx; c.height = hPx;
  const g = c.getContext('2d');
  const lines = text.split('\n');
  let size = hPx / (lines.length * 1.25);
  g.font = `bold ${size}px DejaVu Sans Mono, monospace`;
  const widest = Math.max(...lines.map(l => g.measureText(l).width));
  if (widest > wPx * .9) { size *= wPx * .9 / widest; g.font = `bold ${size}px DejaVu Sans Mono, monospace`; }
  g.fillStyle = '#e8e6dc';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((l, i) => g.fillText(l, wPx / 2, hPx / 2 + (i - (lines.length - 1) / 2) * size * 1.2));
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 8;
  return tex;
}

for (const p of S.parts) {
  const back = p.side === 'back', sgn = back ? -1 : 1;
  const base = back ? -top : top;
  const body = new THREE.Group();
  let mesh;
  if (p.caps) {
    // two-terminal part: body with metal end caps along its axis
    const [x0, y0] = p.outline[0], [x2, y2] = p.outline[2];
    const minx = Math.min(x0, x2), maxx = Math.max(x0, x2), miny = Math.min(y0, y2), maxy = Math.max(y0, y2);
    const vert = p.caps === 'v', L = vert ? maxy - miny : maxx - minx, W = vert ? maxx - minx : maxy - miny;
    const l = L * .8, w = W * .75, capL = l * .2, h = p.height;
    const box = (len, mt, off) => {
      const b = new THREE.Mesh(new THREE.BoxGeometry(vert ? w : len, vert ? len : w, h), mt);
      b.position.set((minx + maxx) / 2 + (vert ? 0 : off), (miny + maxy) / 2 + (vert ? off : 0), base + sgn * h / 2);
      body.add(b);
      return b;
    };
    mesh = box(l - 2 * capL, mat(p.color), 0);
    box(capL, M.cap, -(l - capL) / 2); box(capL, M.cap, (l - capL) / 2);
  } else if (p.boxes) {
    // a part modelled piece by piece: the first box is its body, which takes the hover
    p.boxes.forEach((bx, i) => {
      const m = new THREE.Mesh(new THREE.ExtrudeGeometry(shapeOf(bx.outline), { depth: bx.z[1] - bx.z[0], bevelEnabled: false }),
        mat(bx.color));
      m.position.z = back ? -top - bx.z[1] : top + bx.z[0];
      body.add(m);
      // every piece hovers and lights up as the part, not just its body
      if (!i) mesh = m;
      else register(m, { kind: 'part', ref: p.ref, part: p });
    });
    for (const dt of p.dots || []) {
      const dot = new THREE.Mesh(new THREE.CircleGeometry(dt.r, 20), mat(dt.color));
      dot.position.set(dt.at[0], dt.at[1], back ? -top - p.height - .002 : top + p.height + .002);
      body.add(dot);
    }
  } else {
    const g = new THREE.ExtrudeGeometry(shapeOf(p.outline), { depth: p.height, bevelEnabled: false });
    mesh = new THREE.Mesh(g, mat(p.color));
    mesh.position.z = back ? -top - p.height : top;
    body.add(mesh);
    if (p.pin1) {
      // pin 1 dot, inset from the pin 1 corner
      const ccx = p.outline.reduce((s, q) => s + q[0], 0) / 4, ccy = p.outline.reduce((s, q) => s + q[1], 0) / 4;
      const dot = new THREE.Mesh(new THREE.CircleGeometry(.22, 20), mat('#d8d4c8'));
      dot.position.set(p.pin1[0] + (ccx - p.pin1[0]) * .15, p.pin1[1] + (ccy - p.pin1[1]) * .15, top + p.height + .002);
      body.add(dot);
    }
  }
  if (p.marking && !back) {
    // text plane on top, sized to the outline measured along the reading direction
    const a = p.marking.angle, ca = Math.cos(a), sa = Math.sin(a);
    const us = p.outline.map(([x, y]) => x * ca + y * sa), vs = p.outline.map(([x, y]) => -x * sa + y * ca);
    const L = Math.max(...us) - Math.min(...us), W = Math.max(...vs) - Math.min(...vs);
    const u0 = (Math.max(...us) + Math.min(...us)) / 2, v0 = (Math.max(...vs) + Math.min(...vs)) / 2;
    const tex = markingTexture(p.marking.text, 512, Math.round(512 * W / L));
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(L * .82, W * .78),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    plane.position.set(u0 * ca - v0 * sa, u0 * sa + v0 * ca, top + p.height + .003);
    plane.rotation.z = a;
    body.add(plane);
  }
  groups.parts.add(body);
  register(mesh, { kind: 'part', ref: p.ref, part: p });
}

// ---- implants: approximate models of the hardware implants found in Nano X devices, from implants.js ----

const implantGroups = {};
const implantInfo = info => ({ kind: 'implant', ...info });
function buildImplant(key) {
  const spec = window.IMPLANTS?.[key];
  const g = new THREE.Group();
  if (!spec) return g;
  const material = (p) => {
    const m = new THREE.MeshStandardMaterial({ color: p.color, roughness: .5, metalness: p.color === '#cfcfcc' || p.color === '#c9c9c6' ? .6 : .1,
                                               side: THREE.DoubleSide });
    if (p.opacity !== undefined && p.opacity < 1) { m.transparent = true; m.opacity = p.opacity; m.depthWrite = false; }
    return m;
  };
  for (const p of spec.parts) {
    let mesh;
    const info = implantInfo({ implant: spec.name, title: p.title, notes: p.notes });
    if (p.t === 'slab') {
      const sh = shapeOf(p.poly);
      for (const h of p.holes || []) sh.holes.push(new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x, y))));
      mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: p.z[1] - p.z[0], bevelEnabled: false }), material(p));
      mesh.position.z = p.z[0];
    } else if (p.t === 'box') {
      mesh = new THREE.Mesh(new THREE.BoxGeometry(p.size[0], p.size[1], p.z[1] - p.z[0]), material(p));
      mesh.position.set(p.at[0], p.at[1], (p.z[0] + p.z[1]) / 2);
      if (p.marking) {
        // text on the face pointing away from the board
        const tex = markingTexture(p.marking, 512, Math.round(512 * p.size[1] / p.size[0]));
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(p.size[0] * .85, p.size[1] * .8),
          new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
        const face = p.flip ? p.z[0] - .003 : p.z[1] + .003;
        plane.position.set(p.at[0], p.at[1], face);
        if (p.flip) plane.rotation.y = Math.PI;
        g.add(plane);
      }
    } else if (p.t === 'ribbon') {
      // a strip between x[0] and x[1] following a path of (y, z) points, or with along: 'x', between
      // y[0] and y[1] following a path of (x, z) points
      const pos = [], idx = [];
      p.path.forEach(([t, z], i) => {
        if (p.along === 'x') pos.push(t, p.y[0], z, t, p.y[1], z);
        else pos.push(p.x[0], t, z, p.x[1], t, z);
        if (i) idx.push(2 * i - 2, 2 * i - 1, 2 * i, 2 * i - 1, 2 * i + 1, 2 * i);
      });
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      mesh = new THREE.Mesh(geo, material(p));
    } else if (p.t === 'tube') {
      const curve = new THREE.CatmullRomCurve3(p.points.map(([x, y, z]) => new THREE.Vector3(x, y, z)));
      mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, p.radius, 8), material(p));
    } else if (p.t === 'dome') {
      mesh = new THREE.Mesh(new THREE.SphereGeometry(p.r, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), material(p));
      mesh.scale.y = .45;           // the cap points along y; squash it before turning it to face z
      mesh.rotation.x = p.side === 'back' ? -Math.PI / 2 : Math.PI / 2;
      mesh.position.set(p.at[0], p.at[1], p.z);
    }
    if (!mesh) continue;
    g.add(mesh);
    mesh.userData = info;
    mesh.userData.base = mesh.material;
    pickable.push(mesh);
  }
  g.visible = false;
  root.add(g);
  return g;
}
for (const key of Object.keys(window.IMPLANTS || {})) implantGroups[key] = buildImplant(key);
if (!window.IMPLANTS) $('implant').disabled = true;
$('implant').onchange = e => {
  for (const [k, g] of Object.entries(implantGroups)) g.visible = k === e.target.value;
  const spec = window.IMPLANTS?.[e.target.value];
  $('implant-note').hidden = !spec;
  if (spec) $('implant-note').textContent = spec.summary + `. Approximate model from photographs by ${spec.source || 'Tibane Labs'}.`;
  e.target.blur();
};

// ---- camera views ----
const boardW = Math.max(...xs) - Math.min(...xs);
function view(name) {
  // on a portrait screen the board's length runs up the screen; 70 mm away fits it on a wide screen,
  // further on a narrow one so its length still fits
  const portrait = camera.aspect < 1;
  const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  const across = portrait ? 1 : camera.aspect;
  const k = Math.max(1, boardW * .6 / (Math.tan(halfFov) * across) / 70);
  const d = 70 * k;
  controls.target.set(0, 0, 0);
  if (name === 'top') camera.position.set(portrait ? -0.001 : 0, portrait ? 0 : -0.001, d);
  else if (name === 'bottom') camera.position.set(portrait ? 0.001 : 0, portrait ? 0 : 0.001, -d);
  // the angled view brings the near end closer, so it backs off a little more
  else if (portrait) camera.position.set(-60 * k, 15 * k, 50 * k);
  else camera.position.set(-12 * k, -48 * k, 40 * k);
  controls.update();
}
view('angle');
$('top').onclick = () => view('top');
$('bottom').onclick = () => view('bottom');
$('angle').onclick = () => view('angle');
$('opt-parts').onchange = e => groups.parts.visible = e.target.checked;
$('opt-pours').onchange = e => groups.pours.visible = e.target.checked;
$('opt-tracks').onchange = e => groups.tracks.visible = e.target.checked;

// ---- hover ----
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let lit = [];
function light(meshes) {
  for (const m of lit) m.material = m.userData.base;
  lit = meshes;
  // a see-through part brings its own highlight, so what is inside it stays visible
  for (const m of lit) m.material = m.userData.hi || M.hi;
}
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
function netPads(net) {
  return S.pads.filter(p => p.net === net).map(p => `${p.ref}.${p.num}${p.pin ? ' ' + p.pin : ''}`);
}
function netHtml(net) {
  const info = S.nets[net], items = [];
  for (const t of info?.traces || []) {
    if (t.purpose || t.notes) items.push(`<p>${esc([t.purpose, t.notes].filter(Boolean).join(' · '))}</p>`);
  }
  const ps = netPads(net);
  return [...new Set(items)].slice(0, 3).join('') +
    (ps.length ? `<p class="meta">${ps.length} pad${ps.length > 1 ? 's' : ''}: ${esc(ps.slice(0, 24).join(', '))}${ps.length > 24 ? '…' : ''}</p>` : '');
}
function describe(u) {
  if (u.kind === 'implant') {
    return `<b>${esc(u.title)}</b> <span class="meta">implant · ${esc(u.implant)}</span>` + (u.notes ? `<p>${esc(u.notes)}</p>` : '');
  }
  if (u.kind === 'part') {
    const p = u.part, pads = S.pads.filter(q => q.ref === p.ref && q.net);
    return `<b>${esc(p.ref)}</b> <span class="meta">${esc(p.title)}${p.package ? ' · ' + esc(p.package) : ''} · ${p.side}</span>` +
      (p.notes ? `<p>${esc(p.notes)}</p>` : '') + (u.ct ? `<p>${esc(u.ct)}</p>` : '') +
      (pads.length ? `<ul>${pads.slice(0, 16).map(q => `<li>${esc(q.num)}${q.pin ? ' ' + esc(q.pin) : ''}: ${esc(q.net)}</li>`).join('')}</ul>` : '');
  }
  const head = u.kind === 'pad' ? `${u.ref} pad ${u.num}${u.pin ? ' · ' + u.pin : ''}` : u.kind;
  const ct = u.ct ? `<p>${esc(u.ct)}</p>` : '';
  if (!u.net) return `<b>${esc(head)}</b> <span class="meta">no net</span>` + ct;
  return `<b>${esc(u.net)}</b> <span class="meta">${esc(head)}${u.side ? ' · ' + u.side : ''}</span>` + ct + netHtml(u.net);
}
function pick(x, y) {
  mouse.set(x / innerWidth * 2 - 1, -y / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  return ray.intersectObjects(pickable.filter(m => m.parent.visible && m.visible), false)
    // pours sit under everything else, so prefer anything on top of them, and a see-through package
    // encloses its pins, so prefer those over it
    .sort((a, b) => rank(a.object) - rank(b.object) || a.distance - b.distance)[0];
}
function rank(m) {
  return m.userData.kind === 'pour' ? 2 : m.userData.shell ? 1 : 0;
}
function inspect(x, y) {
  const hit = pick(x, y), tip = $('tip');
  if (!hit) { light([]); tip.hidden = true; return; }
  const u = hit.object.userData;
  light(u.kind === 'implant' ? [hit.object] : u.kind === 'part' ? byRef.get(u.ref) : u.net && u.net !== 'GND' ? byNet.get(u.net) : [hit.object]);
  tip.innerHTML = describe(u);
  tip.hidden = false;
  tip.scrollTop = 0;
  // next to the pointer; on touch screens the stylesheet docks it along the bottom instead
  tip.style.left = Math.min(x + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(y + 14, innerHeight - tip.offsetHeight - 8) + 'px';
}
const el = renderer.domElement;
el.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') inspect(e.clientX, e.clientY); });
el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { light([]); $('tip').hidden = true; } });
// a tap (a touch that barely moves) shows what is under it; tapping empty space clears it
let press = null;
el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') press = e.isPrimary ? { x: e.clientX, y: e.clientY, t: performance.now() } : null; });
el.addEventListener('pointerup', e => {
  if (e.pointerType === 'mouse' || !press) return;
  if (Math.hypot(e.clientX - press.x, e.clientY - press.y) < 10 && performance.now() - press.t < 500) inspect(e.clientX, e.clientY);
  press = null;
});
el.addEventListener('pointercancel', () => { press = null; });

const touch = matchMedia('(pointer: coarse)').matches;
if (touch) $('help').textContent = 'Drag to rotate, pinch to zoom, drag with two fingers to pan. Tap a track, via, pad or part ' +
  'for details; nets light up on both sides. Zoom in on the secure element (SE1) to see inside it.';
// on a phone the panel would cover much of the board: start it folded
if (innerWidth < 600) $('panel').open = false;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
// ---- SE1 from its CT scan: se1_ct.js is large, so it is only loaded once the camera gets close to the chip,
// then blended in over the plain box, which it fully replaces closer in ----
const seMesh = byRef.get('SE1')?.find(m => m.userData.kind === 'part');
const ct = seMesh && { box: seMesh.parent, part: seMesh.userData.part, state: 'idle', t: 0, boxMats: [], ctMats: [] };
// the chip's size on screen, as a fraction of the screen's shorter side: start loading, then blend between
const CT_LOAD = .12, CT_BLEND = [.22, .4];
M.hiGhost = M.hi.clone();
// remember each material's own opacity, so the blend can scale it
function fadeable(m) {
  m.userData.fade = { opacity: m.opacity, transparent: m.transparent, depthWrite: m.depthWrite };
  return m;
}
function setFade(mats, k) {
  for (const m of mats) {
    const f = m.userData.fade, o = f.opacity * k, tr = f.transparent || o < 1;
    m.opacity = o;
    m.depthWrite = o < 1 ? false : f.depthWrite;
    if (m.transparent !== tr) { m.transparent = tr; m.needsUpdate = true; }
  }
}
if (ct) {
  const o = ct.part.outline;
  ct.at = new THREE.Vector3(o.reduce((s, q) => s + q[0], 0) / o.length, o.reduce((s, q) => s + q[1], 0) / o.length, top);
  ct.centre = ct.at.clone().add(root.position).setZ(top + ct.part.height / 2);
  ct.box.traverse(m => { if (m.material) ct.boxMats.push(fadeable(m.material)); });
  fadeable(M.hiGhost);
  seMesh.userData.hi = M.hiGhost;
}
function decodeMesh(m) {
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
  const q = new Uint16Array(bytes(m.v)), p = new Float32Array(q.length);
  for (let i = 0; i < q.length; i++) { const k = i % 3; p[i] = m.lo[k] + q[i] / 65535 * (m.hi[k] - m.lo[k]); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(bytes(m.f)), 1));
  g.computeVertexNormals();

}
const nextFrame = () => new Promise(r => requestAnimationFrame(r));
async function buildCt(C) {
  const g = new THREE.Group(), mats = [];
  g.position.copy(ct.at);
  g.visible = false;
  const fade = m => (mats.push(fadeable(m)), m);
  // see-through mold with its edges and pin 1 dot
  const H = C.body.h, moldG = new THREE.BoxGeometry(C.body.w, C.body.w, H);
  moldG.translate(0, 0, H / 2);
  const mold = new THREE.Mesh(moldG, fade(new THREE.MeshStandardMaterial({ color: '#2b2f36', roughness: .6, transparent: true,
    opacity: .14, depthWrite: false, side: THREE.DoubleSide })));
  g.add(mold);
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(moldG),
    fade(new THREE.LineBasicMaterial({ color: '#8b96a3', transparent: true, opacity: .6 }))));
  const dot = new THREE.Mesh(new THREE.CircleGeometry(.12, 24),
    fade(new THREE.MeshBasicMaterial({ color: '#d8dee6', transparent: true, opacity: .7 })));
  dot.position.set(-1.55, 1.55, H + .006);
  g.add(dot);
  const ctNote = 'Seen through the package, from an X-ray CT scan: the leadframe, the bond wires and the die, topped with a ' +
    'photo of its top metal layer.';
  register(mold, { kind: 'part', ref: ct.part.ref, part: ct.part, ct: ctNote, shell: true });
  mold.userData.hi = M.hiGhost;
  // die: its height from the scan, its outline from the die edge in se1_die.jpg; the photo of its top metal layer is
  // laid on top, placed by fitting its 11 bonded pads to the scanned bond balls (all within 3 um)
  const D = C.die, P = { x: .0002, y: -.0005, w: 2.2659, h: 2.4901, rot: -.0006 };
  const dieG = new THREE.BoxGeometry(D.x1 - D.x0, D.y1 - D.y0, D.z1 - D.z0);
  dieG.translate((D.x0 + D.x1) / 2, (D.y0 + D.y1) / 2, (D.z0 + D.z1) / 2);
  const die = new THREE.Mesh(dieG, fade(new THREE.MeshStandardMaterial({ color: '#3a4a6a', metalness: .3, roughness: .35,
    transparent: true, opacity: .55, depthWrite: false })));
  g.add(die);
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(dieG), fade(new THREE.LineBasicMaterial({ color: '#8aa4d6' }))));
  const photo = new THREE.TextureLoader().load('se1_die.jpg');
  photo.colorSpace = THREE.SRGBColorSpace;
  photo.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const top = new THREE.Mesh(new THREE.PlaneGeometry(P.w, P.h), fade(new THREE.MeshBasicMaterial({ map: photo })));
  top.position.set(P.x, P.y, D.z1 + .002);
  top.rotation.z = P.rot;
  g.add(top);
  // the die sits over the paddle, so pointing at the middle of the chip names the chip
  for (const m of [die, top]) register(m, { kind: 'part', ref: ct.part.ref, part: ct.part, ct: ctNote });
  // highlighted, the photo stays as it is so it can still be seen through the rest of the chip
  die.userData.hi = M.hiGhost;
  top.userData.hi = top.material;
  // bond wires
  const wireMat = fade(new THREE.MeshStandardMaterial({ color: '#f2d27a', metalness: .9, roughness: .25 }));
  for (const w of C.wires) {
    const pts = w.pts.map(p => new THREE.Vector3(...p));
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, 'centripetal'), pts.length * 2, .014, 8), wireMat));
    const ball = new THREE.Mesh(new THREE.SphereGeometry(.02, 16, 12), wireMat);
    ball.position.copy(pts[0]);
    ball.scale.z = .6;
    g.add(ball);
  }
  // leadframe: the paddle and the pins, which take the hover as the chip's pads; one mesh per frame, as each
  // takes a moment to decode
  const cu = { metalness: .75, roughness: .35, side: THREE.DoubleSide };
  const pads = new Map(S.pads.filter(q => q.ref === ct.part.ref).map(q => [q.num, q]));
  for (const [num, mesh, wired] of [['EP', C.paddle, true], ...C.pads.map(p => [String(p.pin), p.mesh, p.wired])]) {
    await nextFrame();
    const m = new THREE.Mesh(decodeMesh(mesh), fade(new THREE.MeshStandardMaterial({ ...cu, color: wired ? '#d9964f' : '#7b6a58' })));
    g.add(m);
    const pad = pads.get(num) || {};
    register(m, { kind: 'pad', net: pad.net, ref: ct.part.ref, num, pin: pad.pin, side: 'front',
      ct: num === 'EP' ? 'Die paddle (CT scan)' : wired ? 'Bonded to the die (CT scan)' : 'No bond wire (CT scan)' });
  }

}
function loadCt() {
  ct.state = 'loading';
  const s = document.createElement('script');
  s.src = 'se1_ct.js';
  s.onload = () => buildCt(window.CHIP_MODEL).catch(e => { ct.state = 'failed'; console.error(e); });
  s.onerror = () => { ct.state = 'failed'; };
  document.head.append(s);
}
const ndc = new THREE.Vector3();
function updateCt() {
  if (!ct) return;
  const d = camera.position.distanceTo(ct.centre);
  const size = 4 / (2 * d * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * Math.min(1, camera.aspect));
  if (ct.state === 'idle' && size > CT_LOAD && groups.parts.visible) {
    ndc.copy(ct.centre).project(camera);
    if (Math.abs(ndc.x) < 1.2 && Math.abs(ndc.y) < 1.2 && ndc.z < 1) loadCt();

  if (ct.state !== 'ready') return;
  // ease towards the target, so the model fades in even when it arrives after the camera is already close
  const target = THREE.MathUtils.smoothstep(size, ...CT_BLEND);
  const t = Math.abs(target - ct.t) < .001 ? target : ct.t + THREE.MathUtils.clamp(target - ct.t, -.06, .06);
  if (t === ct.t) return;
  ct.t = t;
  // the box fades out as the scan fades in, and the highlight goes from solid to see-through with them
  setFade(ct.boxMats, 1 - t);
  setFade(ct.ctMats, t);
  setFade([M.hiGhost], 1 - .75 * t);

  ct.group.visible = t > 0;
}

$('loading').remove();
renderer.setAnimationLoop(() => { controls.update(); updateCt(); renderer.render(scene, camera); });
window.__viewer = { camera, controls, view, pickable, implantGroups, ct };
